<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>универсальный котроллер вввода</title>

<style>
    body { font-family: sans-serif; margin: 20px; background: #2a2a2a; color: white; }
    #game-area {
        width: 600px; height: 300px;
        background: #444; border: 2px solid #666;
        position: relative;
        overflow: hidden; margin-bottom: 20px;
    }

    #platform {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 20px;
        background: #222;
        border-top: 2px solid #555;
    }

    #player {
        width: 40px; height: 40px;
        background: #4caf50;
        border-radius: 5px;
        position: absolute; top: 
        130px; left: 280px;
    }

    #ball {
        width: 40px;
        height: 40px;
        background: #ff5722;
        border-radius: 50%;
        position: absolute;
        bottom: 20px;
        left: 100px;
        transform-origin: bottom center;
    }

    #player.jumping {
        background: #ffc107;
        }
    
    .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    button {
        padding: 8px 12px;
        cursor: pointer;
        background: #555;
        color: white;
        border: 1px solid #777;
        border-radius: 3px;
    }

    button:hover {
        padding: 10px;
        height: 120px;
        overflow-y: auto;
        background: #111;
        padding: 10px;
        font-family: monospace;
        font-size: 12px;
        border: 1px solid #333;
    }
    </style>
</head>    

    <body>
        
        <h2>Интерактивный объект</h2>
        <div id="game-area">
            <div id="player"></div>
            <div id = "ball"></div>
            <div id = "platform"></div>
        </div>

        <h2>Кнопки управления</h2>
        <div class="controls">
            <button id ="btn-attach">Attach (включить)</button>

            <button id ="btn-detach">Detach (выключить)</button>

            <button id ="btn-enable">Включить котроллер</button>

            <button id ="btn-disable">Выключить котроллер</button>

            <button id ="btn-bind-jump">Добавить активность "Прыжок"</button>

            <button id ="btn-disable-jump">Отключить действие "Прыжок"</button>

            <button id ="btn-check-mouse">проверить isKeyPressed (ЛКМ)</button>
        </div>

        <h2>Лог событий</h2>
        <div id="log"></div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

        <script src="Input-controller.js"></script>
        <script src="input-controller-test.js"></script>
        
    </body>
</html>
